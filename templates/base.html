<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ page_title }} | WareHub{% endblock %}</title>
  {% load static %}

  <!-- Theme + sidebar state: apply synchronously before paint -->
  <script>
    (function(){
      var t = localStorage.getItem('wms-theme');
      if (t) document.documentElement.setAttribute('data-theme', t);
      // Clear stale auto-collapsed sidebar state (was set by broken 1280px CSS breakpoint)
      // Only keep it if the user deliberately toggled via the button
      if (!localStorage.getItem('wms-sidebar-user-set')) {
        localStorage.removeItem('sidebar-collapsed');
      }
    })();
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <!-- DataTables -->
  <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">

  <!-- WMS Custom CSS -->
  <link href="{% static 'css/wms.css' %}" rel="stylesheet">

  {% block extra_css %}{% endblock %}
</head>
<body>

<!-- Page loading bar -->
<div id="wms-page-loader"><div class="wms-loader-bar"></div></div>

<!-- Sidebar Overlay (mobile) -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

{% include 'components/sidebar.html' %}

<div class="wms-main" id="wmsMain">
  {% include 'components/topbar.html' %}

  <main class="wms-content">
    {% block content %}{% endblock %}
  </main>

  {% include 'components/footer.html' %}
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- DataTables -->
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
<script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>

<!-- ApexCharts -->
<script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.1/dist/apexcharts.min.js"></script>

<!-- WMS Data Store -->
<script src="{% static 'js/wms-data.js' %}"></script>

<!-- WMS Core JS -->
<script src="{% static 'js/wms.js' %}"></script>

<!-- WMS Interactions & Modals -->
<script src="{% static 'js/wms-interactions.js' %}"></script>

{% block extra_js %}{% endblock %}

<script>
(function () {
  document.addEventListener('click', function (e) {
    var card = e.target.closest('[data-href]');
    if (!card) return;
    if (e.target.closest('a, button, input, select, textarea, [onclick]')) return;
    window.location.href = card.getAttribute('data-href');
  });
})();
</script>
</body>
</html>
