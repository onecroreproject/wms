{% load static %}
<aside class="wms-sidebar" id="wmsSidebar">

  <!-- Brand -->
  <a href="{% url 'dashboard' %}" class="sidebar-brand">
    <div class="brand-icon">
      <i class="fas fa-building"></i>
    </div>
    <div class="brand-text">
      <span class="brand-name">WareHub</span>
      <span class="brand-sub">Rent Management</span>
    </div>
  </a>

  <!-- Navigation -->
  <nav class="sidebar-nav">

    <!-- Main -->
    <div class="nav-section-title">Main</div>

    <a href="{% url 'dashboard' %}" class="nav-item-link {% if active_page == 'dashboard' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-th-large"></i></span>
      <span class="nav-label">Dashboard</span>
    </a>

    <a href="{% url 'warehouse' %}" class="nav-item-link {% if active_page == 'warehouse' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-warehouse"></i></span>
      <span class="nav-label">Warehouse Units</span>
    </a>

    <!-- Tenants -->
    <div class="nav-section-title">Tenants</div>

    <a href="{% url 'tenants' %}" class="nav-item-link {% if active_page == 'tenants' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-user-group"></i></span>
      <span class="nav-label">Tenant Management</span>
    </a>

    <a href="{% url 'leases' %}" class="nav-item-link {% if active_page == 'leases' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-file-contract"></i></span>
      <span class="nav-label">Lease Management</span>
    </a>

    <!-- Finance -->
    <div class="nav-section-title">Finance</div>

    <a href="{% url 'rent_payments' %}" class="nav-item-link {% if active_page == 'rent_payments' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-money-bill-wave"></i></span>
      <span class="nav-label">Rent & Payments</span>
      <span class="nav-badge" id="overdueBadge">3</span>
    </a>

    <a href="{% url 'reports' %}" class="nav-item-link {% if active_page == 'reports' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-chart-bar"></i></span>
      <span class="nav-label">Reports & Analytics</span>
    </a>

    <!-- Support -->
    <div class="nav-section-title">Support</div>

    <a href="{% url 'tickets' %}" class="nav-item-link {% if active_page == 'tickets' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-ticket"></i></span>
      <span class="nav-label">Support Tickets</span>
      <span class="nav-badge" id="ticketBadge">5</span>
    </a>

    <!-- System -->
    <div class="nav-section-title">System</div>

    <a href="{% url 'staff' %}" class="nav-item-link {% if active_page == 'staff' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-users-gear"></i></span>
      <span class="nav-label">Staff Management</span>
    </a>

    <a href="{% url 'notifications' %}" class="nav-item-link {% if active_page == 'notifications' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-bell"></i></span>
      <span class="nav-label">Notifications</span>
      <span class="nav-badge">7</span>
    </a>

    <a href="{% url 'activity_logs' %}" class="nav-item-link {% if active_page == 'activity' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-clock-rotate-left"></i></span>
      <span class="nav-label">Activity Logs</span>
    </a>

    <a href="{% url 'settings' %}" class="nav-item-link {% if active_page == 'settings' %}active{% endif %}">
      <span class="nav-icon"><i class="fas fa-gear"></i></span>
      <span class="nav-label">Settings</span>
    </a>

  </nav>

  <!-- Footer User -->
  <div class="sidebar-footer">
    <a href="{% url 'profile' %}" class="sidebar-footer-user text-decoration-none">
      <div class="footer-avatar">AD</div>
      <div class="sidebar-footer-text">
        <div class="footer-name">Admin User</div>
        <div class="footer-role">Property Manager</div>
      </div>
    </a>
  </div>

</aside>
